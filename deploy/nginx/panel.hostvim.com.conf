# panel.hostvim.com — Panel (musteri/admin kontrol paneli) ozel alan adi + gercek SSL
# Default IP bloguyla ayni icerik; SNI ile panel.hostvim.com sertifikasini sunar.

server {
    listen 80;
    listen [::]:80;
    server_name panel.hostvim.com;

    root /var/www/hostvim/panel/public;

    # Let's Encrypt yenileme
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hostvim/panel/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.hostvim.com;

    ssl_certificate /var/www/hostvim/data/ssl/letsencrypt/config/live/panel.hostvim.com/fullchain.pem;
    ssl_certificate_key /var/www/hostvim/data/ssl/letsencrypt/config/live/panel.hostvim.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PanelHvSSL:10m;

    root /var/www/hostvim/panel/public;
    index index.html index.php;

    client_max_body_size 128M;
    fastcgi_read_timeout 1800s;
    fastcgi_send_timeout 1800s;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /engine-ws/ {
        proxy_pass http://127.0.0.1:9090/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        root /usr/share/;
        index index.php;
        try_files $uri $uri/ /phpmyadmin/index.php?$is_args$args;
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_read_timeout 1800s;
        }
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /index.php/api/$1?$query_string last;
    }

    location ^~ /sanctum/ {
        rewrite ^/sanctum/(.*)$ /index.php/sanctum/$1?$query_string last;
    }

    location = /up {
        try_files $uri /index.php?$is_args$args;
    }

    location ^~ /admin/index.php/ {
        rewrite ^/admin/index\.php(.*)$ /index.php$1 last;
    }

    location ~ ^/index\.php/ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ^~ /admin/admin/assets/ {
        rewrite ^/admin/admin/assets/(.*)$ /assets/$1 break;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /admin/assets/ {
        rewrite ^/admin/assets/(.*)$ /assets/$1 break;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location = /pma-signon {
        rewrite ^ /index.php/pma-signon$is_args$args last;
    }

    location = /webmail-signon {
        rewrite ^ /index.php/webmail-signon$is_args$args last;
    }

    # Mağaza / WHMCS tek kullanımlık SSO (Laravel web route; SPA'ya düşmemeli)
    location = /sso/whmcs {
        rewrite ^ /index.php/sso/whmcs?$is_args$args last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
