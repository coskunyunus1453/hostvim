# Panelze — get.panelze.com
# Tarayıcıya HTML bilgi sayfası; curl/wget'e install.sh (text/plain).
# Kaynak: deploy/get-panelze-com-index.{html,sh}

map $http_user_agent $panelze_get_index {
    default                 /index.html;
    ~*(?i)(curl|wget|httpie|fetch|go-http-client|python-requests|libwww)  /install.sh;
}

server {
    listen 80;
    listen [::]:80;
    server_name get.panelze.com www.get.panelze.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/hostvim/data/www/panelze.com/get/public_html;
        try_files $uri =404;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name get.panelze.com www.get.panelze.com;

    ssl_certificate /var/www/hostvim/data/ssl/letsencrypt/config/live/get.panelze.com/fullchain.pem;
    ssl_certificate_key /var/www/hostvim/data/ssl/letsencrypt/config/live/get.panelze.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PanelzeSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/hostvim/data/www/panelze.com/get/public_html;
    charset utf-8;

    access_log /var/www/hostvim/data/logs/get.panelze.com_access.log;
    error_log /var/www/hostvim/data/logs/get.panelze.com_error.log;

    # curl -fsSL https://get.panelze.com | bash  → install.sh
    # Tarayıcı → index.html
    location = / {
        rewrite ^ $panelze_get_index last;
    }

    location = /install.sh {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache, max-age=0" always;
        try_files /install.sh =404;
    }

    location = /index.html {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "public, max-age=300" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
