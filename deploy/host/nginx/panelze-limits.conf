# PanelKafes — nginx site başına (server_name) + IP başına hız/eşzamanlılık limitleri.
# /etc/nginx/conf.d/ altına kopyalanır; http bağlamında bir kez tanımlanır.
#
# Anahtar: $server_name$binary_remote_addr → sayaç her SİTE için ayrı tutulur. Böylece
# bir sitede tek IP'nin oluşturduğu yük, aynı IP'nin başka sitelerdeki hakkını tüketmez
# ve bir site diğerinden izole şekilde sınırlanır.
#
# Değerler insan trafiği için bolca yüksek, yalnızca sel/bot davranışını 429 ile keser:
#   - panelze_php:  20 istek/sn sürekli + 80 anlık burst (nodelay) → PHP/proxy dinamik istekler.
#   - panelze_conn: IP+site başına 40 eşzamanlı bağlantı.
# Statik dosyalar (css/js/görsel) nginx tarafından doğrudan servis edilir, limitlenmez.
limit_req_zone $server_name$binary_remote_addr zone=panelze_php:16m rate=20r/s;
limit_conn_zone $server_name$binary_remote_addr zone=panelze_conn:16m;

# Limit aşımında 503 yerine 429 (Too Many Requests) döndür — doğru semantik + daha az panik.
limit_req_status 429;
limit_conn_status 429;
