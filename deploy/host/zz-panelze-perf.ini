; Panelze global performans — realpath cache (disk stat yükünü azaltır)
realpath_cache_size = 8192k
realpath_cache_ttl = 600

; OPcache — tüm FPM pool'ları (store + panel + müşteri siteleri) tek paylaşımlı
; SHM kullanır. Filament/Laravel çok sayıda dosya + interne edilen string ürettiğinden
; varsayılan 8MB interned buffer dolup performansı düşürüyordu.
; validate_timestamps/revalidate_freq bilerek DEĞİŞTİRİLMEDİ: müşteri PHP dosya
; değişikliklerinin anında yansıması için varsayılan (açık) davranış korunur.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
