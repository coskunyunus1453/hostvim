# =============================================================================
# Panelze — XAMPP (macOS) Apache sanal host
# =============================================================================
# DocumentRoot: panel/public (Laravel front controller + React SPA)
#
# KURULUM (özet):
#
# 1) /etc/hosts — yerel alan adı:
#    sudo sh -c 'echo "127.0.0.1 panelze.local" >> /etc/hosts'
#
# 2) XAMPP Apache’de sanal host dosyaları açık olsun. Şu dosyayı düzenleyin:
#    /Applications/XAMPP/xamppfiles/etc/httpd.conf
#    İçinde şu satırın başında # olmamalı:
#    Include etc/extra/httpd-vhosts.conf
#
# 3) httpd-vhosts.conf sonuna tek satır ekleyin (tam yol):
#    Include "/Applications/XAMPP/xamppfiles/htdocs/panelze/deploy/host/apache-panelze-xampp.conf"
#
#    İsterseniz bu dosyayı kopyalayıp doğrudan httpd-vhosts.conf içine de yapıştırabilirsiniz.
#
# 4) Apache’yi XAMPP kontrol panelinden yeniden başlatın.
#
# 5) Panel .env:
#    APP_URL=http://panelze.local
#
# Tarayıcı: http://panelze.local/
# =============================================================================

# Projeyi başka dizine taşıdıysanız sadece bu yolu güncelleyin:
Define PANELZE_ROOT "/Applications/XAMPP/xamppfiles/htdocs/panelze"

<VirtualHost *:80>
    ServerName panelze.local
    ServerAlias www.panelze.local
    ServerAdmin webmaster@localhost

    DocumentRoot "${PANELZE_ROOT}/panel/public"

    # Web terminal (WS): /engine-ws/terminal -> engine /ws/terminal
    # Gereken modüller: proxy, proxy_http, proxy_wstunnel
    ProxyPreserveHost On
    ProxyPass "/engine-ws/"  "ws://127.0.0.1:9090/ws/"
    ProxyPassReverse "/engine-ws/"  "ws://127.0.0.1:9090/ws/"

    # Apache varsayılanı genelde sınırsız; bazı şablonlarda düşük LimitRequestBody 413 verebilir.
    LimitRequestBody 134217728

    <Directory "${PANELZE_ROOT}/panel/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        # Dosya yöneticisi: PHP post gövdesi küçükse (varsayılan 8M/40M) 413 (Request Entity Too Large) oluşur.
        # Panel `PANELZE_MAX_FILE_MANAGER_SIZE_MB` ile uyumlu olmalı; biraz başlık payı için >= upload limiti seçin.
        <IfModule php_module>
            php_admin_value upload_max_filesize 128M
            php_admin_value post_max_size 128M
        </IfModule>
    </Directory>

    # XAMPP günlük dizini (ServerRoot’a göre değil, tam yol)
    ErrorLog "/Applications/XAMPP/xamppfiles/logs/panelze-error.log"
    CustomLog "/Applications/XAMPP/xamppfiles/logs/panelze-access.log" common
</VirtualHost>
