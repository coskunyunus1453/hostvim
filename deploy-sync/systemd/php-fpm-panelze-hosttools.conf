# Panelze — PHP-FPM host tool yazma istisnası
#
# Ubuntu php*-fpm.service ProtectSystem=full ile /etc (ve /usr) salt okunur
# mount namespace kullanır. Panel www-data üzerinden sudo ile çağrılan
# panelze-* araçları (/etc/nginx, postfix, dovecot, …) bu yüzden
# "Read-only file system" alır.
#
# RestrictNamespaces=true ayrıca nsenter ile PID1 mount kaçışını engeller;
# ReadWritePaths=/etc bazı systemd sürümlerinde ProtectSystem bind-mount'unu
# geri açmaz. Hosting paneli için ProtectSystem kapatılır — sudoers hâlâ
# yalnızca /usr/local/sbin/panelze-* yollarına izin verir.
[Service]
ProtectSystem=false
