server:
  port: 9090
  host: "0.0.0.0"
  debug: false
  secret_key: "change-me-in-production"
  prometheus_enabled: false
  prometheus_path: "/metrics"
  # Panel → engine dosya yükleme; 15s gibi düşük timeout 502 yapar
  read_timeout_seconds: 600
  write_timeout_seconds: 600
  idle_timeout_seconds: 120

database:
  host: "localhost"
  port: 5432
  name: "panelze"
  user: "panelze"
  password: "secret"

docker:
  enabled: true
  socket_path: "/var/run/docker.sock"
  network: "panelze_net"

services:
  nginx:
    enabled: true
    config_path: "/etc/nginx"
    binary_path: "/usr/sbin/nginx"
  php_fpm:
    enabled: true
    config_path: "/etc/php"
    binary_path: "/usr/sbin/php-fpm"
  mysql:
    enabled: true
    config_path: "/etc/mysql"
    binary_path: "/usr/sbin/mysqld"
  redis:
    enabled: true
    config_path: "/etc/redis"
    binary_path: "/usr/bin/redis-server"

security:
  jwt_secret: "change-this-jwt-secret-in-production"
  internal_api_key: "panelze-engine-internal-dev"
  allowed_origins: "http://localhost,http://127.0.0.1"
  token_expiry: 3600
  max_login_attempts: 5
  fail2ban_enabled: true

# web_root boş bırakılırsa PANELZE_HOME/data/www kullanılır (geliştirme)
paths:
  web_root: ""
  vhosts_dir: "/etc/nginx/sites-available"
  ssl_dir: "/etc/panelze/ssl"
  backup_dir: "/var/backups/panelze"
  log_dir: "/var/log/panelze"
  temp_dir: ""

# Faz 1.1 — Linux prod: nginx_manage_vhosts: true (engine root veya yazma yetkisi gerekir)
hosting:
  nginx_manage_vhosts: false
  nginx_sites_enabled: "/etc/nginx/sites-enabled"
  php_fpm_socket: ""
  nginx_reload_after_vhost: false
  # Alan adı başına pool + open_basedir (nginx ile aynı socket)
  php_fpm_manage_pools: false
  php_fpm_listen_dir: "/run/php"
  php_fpm_pool_dir_template: "/etc/php/{{version}}/fpm/pool.d"
  php_fpm_reload_after_pool: false
  php_fpm_pool_user: "www-data"
  php_fpm_pool_group: "www-data"
  # PanelKafes (dev: kapalı; prod şablonu deploy/configs/engine.production.yaml)
  site_cage_enabled: false
  site_cage_group: "panelze-hosting"
  site_cage_user_prefix: "pk"
  site_cage_engine_user: "www-data"
  site_cage_helper: "/usr/local/sbin/panelze-site-cage"
  site_cage_default_cpu_percent: 100
  site_cage_default_memory_mb: 1024
  site_cage_default_pm_max_children: 20
  site_cage_default_memory_limit: "256M"
  # Apache (server_type: apache); prod’da true + yazma yetkisi
  apache_manage_vhosts: false
  nginx_edge_proxy: false
  apache_sites_available: "/etc/apache2/sites-available"
  apache_sites_enabled: "/etc/apache2/sites-enabled"
  apache_reload_after_vhost: false
  # OpenLiteSpeed (server_type: openlitespeed); prod: manage true + httpd_config içine include satırları (paket başlık yorumlarına bakın)
  openlitespeed_manage_vhosts: false
  openlitespeed_http_port: 8088
  openlitespeed_conf_root: "/usr/local/lsws"
  openlitespeed_reload_after_vhost: false
  openlitespeed_ctrl_path: ""
  # Let’s Encrypt (certbot webroot); Linux prod: manage_ssl true + certbot kurulu
  manage_ssl: false
  certbot_path: ""
  lets_encrypt_email: ""
  lets_encrypt_staging: false
  # true ise yalnızca kök domain (ornek.com) için certbot SAN'a www.ornek.com ekler; alt alan adlarında asla eklenmez
  lets_encrypt_include_www: false
  # Faz 2.4 — site belge kökünde composer / npm (prod: true + güvenilir PATH)
  manage_site_tools: false
  manage_node_apps: false
  composer_path: "composer"
  npm_path: "npm"
  tools_max_seconds: 300
  wordpress_zip_url: "https://wordpress.org/latest.zip"
  # İsteğe bağlı: çekirdek/yol değişiminde yeniden derlemeden betik konumu
  # nginx_vhost_helper: "/usr/local/sbin/panelze-nginx-vhost"
  # stack_install_script: "/usr/local/sbin/panelze-stack-install"
  # Faz 6 — gerçek tar.gz yedeği (geliştirmede false)
  execute_backups: false
  backup_tar_path: "tar"
  backup_max_seconds: 3600
  execute_backup_restore: false

# Dosya yöneticisi — zip açma (ZIP bomb koruması; büyük vendor/CMS arşivleri için entry limiti)
files:
  max_unzip_entries: 100000
  max_unzip_uncompressed_bytes: 5368709120
  max_unzip_entry_ratio: 300
  max_unzip_archive_ratio: 200
